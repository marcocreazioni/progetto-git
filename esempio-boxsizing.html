<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  * {margin: 0px;
     padding: 0px;
     box-sizing:border-box;
     position: absolute;
     
  }

        /* box-sizing: border-box assimila lo spessore del bordo a quelle dell'
        oggetto */
        .simple {
  width: 500px;
  top: 20px;
 
}

.fancy {
  width: 500px;
  top: 50px;
  padding: 50px;
  border: solid blue 10px;
  
}
    </style>
</head>
<body>
    <div class="simple">
Ora abbiamo le stesse dimensioni!
    </div> 
    <div class="fancy">

Urrà!
    </div>   
</body>
</html>
